<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E8FAD"/><stop offset="0.55" stop-color="#133D50"/><stop offset="1" stop-color="#08202B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4FD8"/><stop offset="1" stop-color="#FF3B5C"/>
    </linearGradient>
    <linearGradient id="euro" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="350">
      <stop offset="0" stop-color="#2A6A85"/><stop offset="1" stop-color="#133D50"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04131A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="512" height="512" rx="128" fill="url(#glow)"/>
  <!-- sparkles -->
  <path d="M410 92 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M104 392 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="420" cy="410" r="7" fill="#7DF9FF" opacity="0.85"/>
  <!-- shield -->
  <path filter="url(#drop)" d="M256 86 L392 136 V250 C392 340 334 400 256 430 C178 400 120 340 120 250 V136 Z" fill="#FFFFFF"/>
  <!-- euro -->
  <g fill="none" stroke="url(#euro)" stroke-linecap="round" stroke-width="30">
    <path d="M318 206 A72 72 0 1 0 318 318"/>
  </g>
  <g stroke="url(#euro)" stroke-linecap="round" stroke-width="24">
    <line x1="186" y1="238" x2="282" y2="238"/><line x1="186" y1="284" x2="270" y2="284"/>
  </g>
  <!-- the ban: neon strike through the whole shield -->
  <line x1="128" y1="122" x2="392" y2="408" stroke="url(#slash)" stroke-width="40" stroke-linecap="round" filter="url(#neon)"/>
  <line x1="128" y1="122" x2="392" y2="408" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
</svg>
